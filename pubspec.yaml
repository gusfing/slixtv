name: slix_iptv
description: "Premium IPTV streaming application with Netflix-like UI and MAG/Stalker portal support"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Storage
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Player
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  floating: ^6.0.0

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  flutter_json_view: ^1.1.2

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.3.3
  package_info_plus: ^8.2.1
  share_plus: ^10.1.4
  flutter_inappwebview: ^6.1.5

  # Logging
  logger: ^2.5.0
  pretty_dio_logger: ^1.4.0
  xml: ^6.5.0
  html: ^0.15.6
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.6.4
  build_runner: ^2.15.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
